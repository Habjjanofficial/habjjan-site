<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habjjan | Site Officiel - Pop, Electro & Urban Music</title>
    <meta name="description" content="Découvrez l'univers musical de Habjjan. Écoutez les derniers titres et suivez l'actualité de l'artiste.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #fff;
            background-color: #050505;
            background-image: url('assets/1A452DA5-943C-47C7-BBF9-E6CC4DE21660.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,.42), rgba(0,0,0,.08) 50%, rgba(0,0,0,.42));
            z-index: 1;
        }
        .container {
            position: relative;
            padding: 40px;
            background: rgba(8,8,8,.28);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 24px 80px rgba(0,0,0,.45);
            border-radius: 20px;
            z-index: 2;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 5px;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,.5);
            text-transform: uppercase;
        }
        p {
            color: #e0e0e0;
            font-size: 1.3rem;
            margin: 0 0 40px;
            font-weight: 300;
            text-shadow: 0 1px 5px rgba(0,0,0,.5);
        }
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 14px 32px;
            background-color: #1db954;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform .3s, filter .3s;
            box-shadow: 0 4px 15px rgba(0,0,0,.3);
        }
        .links a.youtube { background-color: #ff0000; }
        .links a:hover { transform: translateY(-3px); filter: brightness(1.1); }
        @media (max-width: 600px) {
            body { background-attachment: scroll; background-position: center top; }
            .container { margin: 20px; padding: 30px 20px; }
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; }
            .links a { padding: 12px 24px; font-size: 1rem; }
        }
        .socials { margin-top: 28px; display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
        .socials a { color:#fff; text-decoration:none; text-transform:uppercase; letter-spacing:2px; font-size:.78rem; opacity:.78; transition:opacity .25s, transform .25s; }
        .socials a:hover { opacity:1; transform:translateY(-2px); }
        body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:1; box-shadow:inset 0 0 180px rgba(0,0,0,.85); }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <main class="container">
        <h1>HABJJAN</h1>
        <p>Artiste & Musicien</p>
        <div class="links">
            <a href="https://open.spotify.com/artist/1RniqORImVv3ij2RtIMByR" target="_blank" rel="noopener noreferrer">Spotify</a>
            <a href="https://www.youtube.com/@Habjjan" target="_blank" rel="noopener noreferrer" class="youtube">YouTube</a>
        </div>
        <nav class="socials" aria-label="Réseaux sociaux">
            <a href="https://www.facebook.com/Habjjan" target="_blank" rel="noopener noreferrer">Facebook</a>
            <a href="https://www.instagram.com/iamhabjjan/" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://www.tiktok.com/@iamhabjjan" target="_blank" rel="noopener noreferrer">TikTok</a>
        </nav>
    </main>
</body>
</html>
