<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habjjan | Site Officiel - Pop, Electro & Urban Music</title>
    <meta name="description" content="Découvrez l'univers musical de Habjjan. Écoutez les derniers titres et suivez l'actualité de l'artiste.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #fff;
            background-color: #000;
            background-image: url('assets/habjjan-hero.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,.30);
            z-index: 1;
        }
        .container {
            position: relative;
            padding: 40px;
            background-color: rgba(0,0,0,.25);
            border-radius: 20px;
            z-index: 2;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 5px;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,.5);
            text-transform: uppercase;
        }
        p {
            color: #e0e0e0;
            font-size: 1.3rem;
            margin: 0 0 40px;
            font-weight: 300;
            text-shadow: 0 1px 5px rgba(0,0,0,.5);
        }
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 14px 32px;
            background-color: #1db954;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform .3s, filter .3s;
            box-shadow: 0 4px 15px rgba(0,0,0,.3);
        }
        .links a.youtube { background-color: #ff0000; }
        .links a:hover { transform: translateY(-3px); filter: brightness(1.1); }
        @media (max-width: 600px) {
            body { background-attachment: scroll; background-position: center top; }
            .container { margin: 20px; padding: 30px 20px; }
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; }
            .links a { padding: 12px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <main class="container">
        <h1>HABJJAN</h1>
        <p>Artiste & Musicien</p>
        <div class="links">
            <a href="https://open.spotify.com/artist/1RniQDrWv3iJ2RtINbYR" target="_blank" rel="noopener noreferrer">Spotify</a>
            <a href="https://www.youtube.com/@Habjjan" target="_blank" rel="noopener noreferrer" class="youtube">YouTube</a>
        </div>
    </main>
</body>
</html>
