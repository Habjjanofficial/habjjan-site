  <script>
    (() => {
      const intro = document.getElementById('site-intro');
      const video = document.getElementById('site-intro-video');
      const key = 'habjjanIntroSeen';
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const removeIntro = (fade = true) => {
        if (!intro) return;
        if (!fade) {
          intro.hidden = true;
          return;
        }
        intro.classList.add('is-ending');
        window.setTimeout(() => { intro.hidden = true; }, 520);
      };

      if (reducedMotion || sessionStorage.getItem(key) === '1') {
        removeIntro(false);
        return;
      }

      sessionStorage.setItem(key, '1');

      const finish = () => removeIntro(true);
      video.addEventListener('ended', finish, { once:true });
      video.addEventListener('error', () => removeIntro(false), { once:true });

      const playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(() => removeIntro(false));
      }

      window.setTimeout(() => {
        if (!intro.hidden) finish();
      }, 7000);
    })();
  </script>
