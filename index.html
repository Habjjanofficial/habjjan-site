<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow-x:hidden;
      color:#f4efe7;
      text-align:center;

      background:#050505 url('assets/1A452DA5-943C-47C7-BBF9-E6CC4DE21660.png') center/cover no-repeat fixed;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      background:
        radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.18) 58%, rgba(0,0,0,.78) 100%),
        linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.32));
    }
    body::after {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      opacity:.12;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }
    .container {
      position:relative;
      z-index:2;
      width:min(920px,92vw);
      padding:42px 28px 34px;
    }
    .eyebrow {
      margin:0 0 14px;
      font-size:.68rem;
      font-weight:400;
      letter-spacing:.48em;
      text-transform:uppercase;
      color:#c99a6b;
    }
    h1 {
      margin:0;
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(4.3rem,11vw,8.8rem);
      line-height:.78;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#f4efe7;
      text-shadow:0 10px 35px rgba(0,0,0,.62);
    }
    h1 .jj {
      color:#c99a6b;
      font-style:italic;
      letter-spacing:-.04em;
      margin:0 .025em;
    }
    .rule {
      width:72px;
      height:1px;
      margin:27px auto 18px;
      background:#c99a6b;
      box-shadow:0 0 16px rgba(201,154,107,.35);
    }
    .subtitle {
      margin:0 0 42px;
      color:rgba(244,239,231,.82);
      font-size:.76rem;
      font-weight:300;
      letter-spacing:.42em;
      text-transform:uppercase;
    }
    .socials {
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px 0;
    }
    .socials a {
      position:relative;
      padding:0 16px;
      color:rgba(244,239,231,.78);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:.66rem;
      font-weight:400;
      transition:color .25s ease, transform .25s ease;
    }
    .socials a + a::before {
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:2px;
      height:2px;
      border-radius:50%;
      background:#c99a6b;
    }
    .socials a:hover,
    .socials a:focus-visible {
      color:#c99a6b;
      transform:translateY(-2px);
      outline:none;
    }
    @media (max-width:600px) {
      body {
        min-height:100svh;
        background-attachment:scroll;
        background-position:center top;
      }
      .container {
        width:100%;
        padding:24px 18px 28px;
      }
      .eyebrow {
        margin-bottom:12px;
        font-size:.54rem;
        letter-spacing:.30em;
      }
      h1 {
        font-size:clamp(3rem,16.5vw,4.7rem);
        line-height:.84;
        letter-spacing:.025em;
        white-space:nowrap;
      }
      .rule {
        width:56px;
        margin:22px auto 15px;
      }
      .subtitle {
        margin-bottom:28px;
        font-size:.58rem;
        letter-spacing:.24em;
      }
      .socials {
        max-width:360px;
        margin:0 auto;
        gap:0;
        row-gap:14px;
      }
      .socials a {
        padding:0 9px;
        font-size:.57rem;
        line-height:1.6;
        letter-spacing:.10em;
      }
    }
    @media (max-width:380px) {
      h1 { font-size:15.5vw; }
      .socials { max-width:320px; }
      .socials a { padding:0 7px; font-size:.54rem; }
    }
  </style>
</head>
